# ============================================================
#  BOSS 自动投递 · 个人配置模板
#
#  用法：
#    1) 复制成 config/profile.yaml（不要直接改这个文件）
#    2) 或者跑 python scripts/onboard.py --resume 你的简历.pdf
#       让它读你的简历自动生成草稿，你再改两句
#
#  这个文件是仓库里的通用模板，config/profile.yaml 不会入库。
# ============================================================

candidate:
  name: ""            # 可留空；只用于报告展示，不参与任何判断
  city: 北京
  note: 随时到岗

# ------------------------------------------------------------
# 我会的技术 —— 判断「这个岗位我干不干得了」的唯一依据
#
# 权重：3 = 核心（能聊实现细节）/ 2 = 熟练 / 1 = 了解
# 只写你真的会的。写了不会的技术，脚本会替你投你干不了的岗位。
# ------------------------------------------------------------
skills:
  # 大模型应用
  langchain: 3
  langgraph: 3
  rag: 3
  检索增强: 3
  知识库: 2
  向量: 2
  faiss: 3
  embedding: 2
  混合检索: 3
  召回: 2
  问答: 1
  提示词: 3
  prompt: 2
  function calling: 3
  mcp: 2
  agent: 3
  智能体: 3
  工具调用: 3
  编排: 2
  大模型: 3
  llm: 3
  # 模型侧
  transformer: 2
  lora: 2
  pytorch: 2
  微调: 2
  nlp: 2
  机器学习: 3
  # 工程
  python: 3
  fastapi: 3
  pydantic: 2
  sqlalchemy: 2
  asyncio: 2
  aiohttp: 2
  docker: 2
  linux: 1
  git: 1
  restful: 2
  后端: 2
  服务端: 2
  并发: 2
  微服务: 1
  全栈: 2
  # 数据
  mysql: 1
  postgresql: 2
  redis: 1
  hive: 2
  pandas: 2
  etl: 2
  数仓: 2
  sql: 2
  爬虫: 3

# ------------------------------------------------------------
# 岗位类别 → 关键词：决定这条投递用哪一句话术
# 标题命中权重 ×3，正文命中权重 ×1，取总分最高的类别
# ------------------------------------------------------------
categories:
  rag:
    - rag
    - 检索增强
    - 知识库
    - 向量
    - faiss
    - embedding
    - 召回
    - bm25
    - 问答
    - 语义检索
  agent:
    - agent
    - 智能体
    - 工作流
    - 编排
    - 工具调用
    - react
    - mcp
    - function calling
    - coze
    - dify
  llm:
    - 大模型
    - llm
    - 算法
    - nlp
    - 微调
    - lora
    - transformer
    - pytorch
    - 深度学习
    - 模型训练
  eng:
    - 后端
    - 服务端
    - python
    - fastapi
    - django
    - flask
    - 全栈
    - 接口
    - 并发
    - asyncio
    - 微服务
    - docker
    - linux
  data:
    - 数据开发
    - 数仓
    - etl
    - hive
    - spark
    - flink
    - 爬虫
    - 采集
    - sql
    - 数据治理

# ------------------------------------------------------------
# 一次性开场话术 —— 固定文本，按类别取用，不按岗位生成
#
# 约束：
#   * 每条 ≤ fit.max_message_len（默认 40 字），超了 onboard --check 会报错
#   * 不写姓名、学历、公司名、薪资
#   * 写「具体做法 + 能力落点」，别只堆技术名词
#   * 结尾留个话头（可聊 / 方便发简历），比干巴巴介绍更容易被回
# ------------------------------------------------------------
messages:
  rag: 做过RAG问答项目：切片、向量检索、拒答护栏，可聊
  agent: 做过Agent项目：工具调用、参数校验、防编造，可聊
  llm: 做过大模型应用落地：RAG问答 + Agent 调度，可聊
  eng: Python后端 + 异步并发 + Docker 部署，能独立扛，可聊
  data: 数据清洗到入库全链路，ETL + 数仓，可聊
  default: 有AI应用落地经验，Python 后端也能接，可聊

# ------------------------------------------------------------
# 什么岗位不投
# ------------------------------------------------------------
# 岗位名称里出现这些 → 明显不是技术岗，直接跳过
block_titles:
  - 销售
  - 客服
  - 运营
  - 人事
  - 行政
  - 财务
  - 会计
  - 法务
  - 教师
  - 讲师
  - 主播
  - 司机
  - 配送
  - 导购
  - 中介
  - 房产
  - 文案
  - 编辑
  - 平面设计
  - 视频剪辑
  - 机械
  - 电气
  - 土木
  - 施工
  - 医药代表
  - 护士
  - 翻译
  - 产品经理
  - 项目经理

# 标题看不出是什么岗（「线上面试（离职优先）」这类钩子标题）时，
# JD 正文出现这些 → 其实是销售/门店岗，跳过
block_body:
  - 门店
  - 销售指标
  - 提成
  - 接待客户
  - 地推
  - 电销
  - 招商
  - 加盟
  - 导购
  - 收银
  - 美容
  - 健身
  - 保险代理

# 岗位名称里出现这些 → 认定是技术岗
dev_titles:
  - 开发
  - 工程师
  - 研发
  - 算法
  - 架构
  - 技术
  - 程序
  - 全栈
  - 后端
  - 数据
  - ai
  - 人工智能
  - 机器学习

# ------------------------------------------------------------
# 判断阈值
# ------------------------------------------------------------
fit:
  # 标题看不出岗位时，JD 里技术权重到这个分数就直接投
  min_score: 3
  # JD 短于这个字数 = 信息不足，按「广撒」口径放行
  short_jd: 200
  # 话术字数上限
  max_message_len: 40

limits:
  daily: 150      # BOSS 每日沟通上限
  reserve: 2      # 留几个额度不烧完
  log_keep_days: 1  # 超过 N 天自动删日志/报告（台账不受影响）
  log_enabled: true # false = 压根不写日志文件，只在控制台输出
