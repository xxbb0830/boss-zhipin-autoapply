# ------------------------------------------------------------
# 判断阈值
# ------------------------------------------------------------
fit:
  # 标题看不出岗位时，JD 里技术权重到这个分数就直接投
  min_score: 3
  # JD 短于这个字数 = 信息不足，按「广撒」口径放行
  short_jd: 200
  # 话术字数上限
  max_message_len: 80

limits:
  daily: 150      # BOSS 每日沟通上限
  reserve: 2      # 留几个额度不烧完
  log_keep_days: 1  # 超过 N 天自动删日志/报告（台账不受影响）
  log_enabled: true # false = 压根不写日志文件，只在控制台输出

# ------------------------------------------------------------
# 节奏控制
#
# 默认全速：gap=0，投完一个立刻下一个。脚本不再「假装人手慢慢点」，
# 所有等待都改成轮询 —— 界面就绪立刻往下走，没就绪才等到超时。
#
# 想放慢（比如担心频率）：把 gap 改成 7、gap_max 改成 15。
# 其余几项是各环节的等待上限，一般不用动。
# ------------------------------------------------------------
pacing:
  gap: 0            # 两个岗位之间的间隔（秒）；0 = 全速
  gap_max: 0        # 间隔的上限，gap>0 时生效（随机取 gap~gap_max）
  tap: 0.15         # 点击/返回后等界面反应的基准时间
  poll: 0.12        # 轮询步长，越小越灵敏
  detail_timeout: 3   # 等岗位详情页出现
  chat_timeout: 5     # 等聊天页出现
  send_timeout: 3     # 等消息气泡上屏
