# ============================================================
#  BOSS 自动投递 · 个人配置模板
#
#  用法：
#    1) 复制成 config/profile.yaml（不要直接改这个文件）
#    2) 或者跑 python scripts/onboard.py --resume 你的简历.pdf
#       让它读你的简历自动生成草稿，你再改两句
#
#  这个文件是仓库里的通用模板，config/profile.yaml 不会入库。
# ============================================================

candidate:
  name: ""            # 可留空；只用于报告展示，不参与任何判断
  city: 北京
  note: 随时到岗

# ------------------------------------------------------------
# 我会的技术 —— 判断「这个岗位我干不干得了」的唯一依据
#
# 权重：3 = 核心（能聊实现细节）/ 2 = 熟练 / 1 = 了解
# 只写你真的会的。写了不会的技术，脚本会替你投你干不了的岗位。
# ------------------------------------------------------------
skills:
  # 大模型应用
  langchain: 3
  langgraph: 3
  rag: 3
  检索增强: 3
  知识库: 2
  向量: 2
  faiss: 3
  embedding: 2
  混合检索: 3
  召回: 2
  问答: 1
  提示词: 3
  prompt: 2
  function calling: 3
  mcp: 2
  agent: 3
  智能体: 3
  工具调用: 3
  编排: 2
  大模型: 3
  llm: 3
  # 模型侧
  transformer: 2
  lora: 2
  pytorch: 2
  微调: 2
  nlp: 2
  机器学习: 3
  # 工程
  python: 3
  fastapi: 3
  pydantic: 2
  sqlalchemy: 2
  asyncio: 2
  aiohttp: 2
  docker: 2
  linux: 1
  git: 1
  restful: 2
  后端: 2
  服务端: 2
  并发: 2
  微服务: 1
  全栈: 2
  # 数据
  mysql: 1
  postgresql: 2
  redis: 1
  hive: 2
  pandas: 2
  etl: 2
  数仓: 2
  sql: 2
  爬虫: 3

# ------------------------------------------------------------
# 岗位类别 → 关键词：决定这条投递用哪一句话术
# 标题命中权重 ×3，正文命中权重 ×1，取总分最高的类别
# ------------------------------------------------------------
categories:
  rag:
    - rag
    - 检索增强
    - 知识库
    - 向量
    - faiss
    - embedding
    - 召回
    - bm25
    - 问答
    - 语义检索
  agent:
    - agent
    - 智能体
    - 工作流
    - 编排
    - 工具调用
    - react
    - mcp
    - function calling
    - coze
    - dify
  llm:
    - 大模型
    - llm
    - 算法
    - nlp
    - 微调
    - lora
    - transformer
    - pytorch
    - 深度学习
    - 模型训练
  eng:
    - 后端
    - 服务端
    - python
    - fastapi
    - django
    - flask
    - 全栈
    - 接口
    - 并发
    - asyncio
    - 微服务
    - docker
    - linux
  data:
    - 数据开发
    - 数仓
    - etl
    - hive
    - spark
    - flink
    - 爬虫
    - 采集
    - sql
    - 数据治理

# ------------------------------------------------------------
# 一次性开场话术 —— 固定文本，按类别取用，不按岗位生成
#
# 约束：
#   * 每条 ≤ fit.max_message_len（默认 80 字），超了 onboard --check 会报错
#   * 不写姓名、学历、公司名、薪资
#   * 口语化，写「我做过什么 + 怎么做的」，别只堆技术名词
#   * 结尾不要「可聊」这种话，落在具体动作上：
#       - 技术岗：反问一句（您这边…？）—— 对方是技术负责人，愿意聊细节
#       - 通用岗：给动作（合适的话我把简历发您）—— HR 多，直接给动作回复率高
# ------------------------------------------------------------
messages:
  rag: 我之前做过RAG问答，从文档切片、向量检索到答不准就拒答，这几块都是我写的。您这岗位也是这个方向吗？
  agent: 我做过Agent项目，工具调用、参数校验和防编造都是自己加的，线上跑过。您这边主要落在哪块业务？
  llm: 我做过两个大模型落地的项目，原理和工程两边都碰过。您这岗位更偏哪一边？
  eng: 我主要写Python后端，异步并发和Docker部署都是自己弄的。您这边后端用什么栈？
  data: 我做过数据清洗到入库的全链路，ETL和数仓调优都做过。您这边数据这块现在缺哪一环？
  default: 我这一年主要做大模型应用落地，Python后端也能写。合适的话我把简历发您。

